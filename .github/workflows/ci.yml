name: XOLUM Fiscal CI

on:
  push:
    branches: [main, hardening/**, dev/**]
  pull_request:
    branches: [main, hardening/**]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install XSLT runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xsltproc

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
